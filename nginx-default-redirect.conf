# 兜底跳转：IP 直连 / 未知域名 / 未匹配 SNI → 301 到主域名
# （精确匹配 trustfacai.com / www 的请求仍由 trustfacai 站点配置承接，不受影响）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://trustfacai.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/trustfacai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trustfacai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://trustfacai.com$request_uri;
}
