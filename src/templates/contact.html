    <div class="relative px-6 py-10 md:px-12 md:py-14 text-white">

        <div class="flex-1 w-full order-1 md:order-2">
          <div class="bg-white/10 backdrop-blur-sm ring-1 ring-white/15 rounded-xl px-4 md:px-5 py-3.5 flex items-center justify-between gap-3 mb-3">

          <p class="text-blue-200/60 text-[11px] md:text-xs mb-7">（手机端用户可长按识别二维码，或复制微信号添加好友，备注：网站）</p>

          <div class="bg-white/[0.06] ring-1 ring-white/10 rounded-xl divide-y divide-white/10 backdrop-blur-sm">

        <!-- 二维码：PC 左侧，移动端居下 -->
        <div class="shrink-0 text-center order-2 md:order-1">
